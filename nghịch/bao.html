<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Lovely Hearts Plus+</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            background: radial-gradient(circle at top, #f472b6 0%, #4c1d95 40%, #020617 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fdf2f8;
            position: relative;
        }
        /* Glow sweep trên nền */
        
        .bg-sweep {
            position: absolute;
            inset: -20%;
            background: radial-gradient(circle at 10% 0, rgba(244, 114, 182, 0.25), transparent 55%);
            mix-blend-mode: screen;
            opacity: 0;
            animation: sweep 9s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes sweep {
            0%,
            40% {
                opacity: 0;
                transform: translateX(-20%) translateY(0);
            }
            50% {
                opacity: 0.6;
                transform: translateX(10%) translateY(-5%);
            }
            60%,
            100% {
                opacity: 0;
                transform: translateX(30%) translateY(0);
            }
        }
        /* Card trung tâm */
        
        .card {
            position: relative;
            z-index: 3;
            background: rgba(15, 23, 42, 0.78);
            border-radius: 24px;
            padding: 24px 28px;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.95), 0 0 40px rgba(244, 114, 182, 0.38);
            border: 1px solid rgba(244, 114, 182, 0.5);
            backdrop-filter: blur(18px);
        }
        
        .card-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: #f9a8d4;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
        }
        
        .card-sub {
            margin-top: 8px;
            font-size: 14px;
            color: #e5e7eb;
        }
        
        .pill {
            margin: 14px auto 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(236, 72, 153, 0.18);
            border: 1px solid rgba(244, 114, 182, 0.5);
            font-size: 12px;
            color: #fecdd3;
        }
        
        .pill-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #f97316;
            box-shadow: 0 0 10px rgba(248, 113, 113, 0.9);
        }
        
        .hint {
            margin-top: 8px;
            font-size: 12px;
            color: #fce7f3;
            opacity: 0.9;
        }
        /* Container trái tim & particle */
        
        .hearts-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        /* Trái tim */
        
        .heart {
            position: absolute;
            bottom: -40px;
            width: 26px;
            height: 26px;
            background-color: #fb7185;
            transform: rotate(-45deg);
            animation: floatUp 7s linear infinite;
            opacity: 0.95;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 0 8px rgba(248, 113, 158, 0.7));
        }
        
        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 26px;
            height: 26px;
            background-color: inherit;
            border-radius: 50%;
        }
        
        .heart::before {
            top: -13px;
            left: 0;
        }
        
        .heart::after {
            left: 13px;
            top: 0;
        }
        /* Một số tim kiểu "xoay orbit" */
        
        .heart.spin {
            animation: floatUp 7s linear infinite, spinHeart 3s ease-in-out infinite;
        }
        
        @keyframes spinHeart {
            0%,
            100% {
                transform: rotate(-45deg) scale(1);
            }
            50% {
                transform: rotate(-35deg) scale(1.15);
            }
        }
        /* Tim đập (pulse) */
        
        .heart.pulse {
            animation: floatUp 7s linear infinite, heartBeat 1.2s ease-in-out infinite;
        }
        
        @keyframes heartBeat {
            0%,
            20%,
            100% {
                transform: rotate(-45deg) scale(1);
            }
            10% {
                transform: rotate(-45deg) scale(1.25);
            }
        }
        /* Tim đang giữ */
        
        .heart.paused {
            animation-play-state: paused;
            box-shadow: 0 0 20px rgba(251, 113, 133, 0.9), 0 0 40px rgba(244, 114, 182, 0.85);
            transform: scale(1.3) rotate(-45deg);
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(-45deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            50% {
                transform: translateY(-55vh) translateX(25px) rotate(-40deg);
            }
            80% {
                transform: translateY(-95vh) translateX(-15px) rotate(-52deg);
            }
            100% {
                transform: translateY(-125vh) translateX(-30px) rotate(-45deg);
                opacity: 0;
            }
        }
        /* Ripple “vũng nước” */
        
        .ripple {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(248, 250, 252, 0.85);
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: rippleAnim 0.7s ease-out forwards;
            z-index: 2;
        }
        
        .ripple.big {
            border-color: rgba(248, 113, 158, 0.8);
            animation-duration: 0.9s;
        }
        
        @keyframes rippleAnim {
            0% {
                opacity: 0.85;
                transform: translate(-50%, -50%) scale(0.15);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(3.7);
            }
        }
        /* Particles nhỏ */
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(251, 113, 133, 0.55);
            box-shadow: 0 0 12px rgba(244, 114, 182, 0.9);
            animation: particleFloat 12s linear infinite;
        }
        
        @keyframes particleFloat {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            50% {
                transform: translateY(-60vh) translateX(20px);
                opacity: 0.9;
            }
            100% {
                transform: translateY(0) translateX(-15px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="bg-sweep"></div>

    <div class="card">
        <div class="card-title">Lovely Hearts+</div>
        <p class="card-sub">chơi phi phai không bé</p>
        <div class="pill">
            <span class="pill-dot"></span>
            <span>Chạm/nhấp vào trái tim để giữ lại &amp; tạo gợn nước</span>
        </div>
        <p class="hint">Chạm vào nền để thêm tim mới &amp; ripple lớn.</p>
    </div>

    <div class="hearts-container" id="heartsContainer"></div>

    <script>
        const container = document.getElementById('heartsContainer');

        function createRipple(clientX, clientY, big = false) {
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            if (big) ripple.classList.add('big');
            ripple.style.left = clientX + 'px';
            ripple.style.top = clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), big ? 1000 : 800);
        }

        function createHeart(xPos = null) {
            const heart = document.createElement('div');
            heart.classList.add('heart');

            const x = xPos !== null ? xPos : Math.random() * window.innerWidth;
            heart.style.left = x + 'px';

            const size = 18 + Math.random() * 26;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';

            const colors = ['#fb7185', '#f9a8d4', '#fecdd3', '#f472b6'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.backgroundColor = color;

            const duration = 6 + Math.random() * 5;
            const delay = Math.random() * 3;
            heart.style.animationDuration = duration + 's';
            heart.style.animationDelay = delay + 's';

            // Một số tim có hiệu ứng thêm
            const rnd = Math.random();
            if (rnd < 0.33) heart.classList.add('spin');
            else if (rnd < 0.66) heart.classList.add('pulse');

            let isTouching = false;

            heart.addEventListener('mouseenter', (e) => {
                if (!isTouching) {
                    heart.classList.add('paused');
                    createRipple(e.clientX, e.clientY);
                }
            });

            heart.addEventListener('mouseleave', () => {
                if (!isTouching) {
                    heart.classList.remove('paused');
                }
            });

            heart.addEventListener('click', (e) => {
                heart.classList.toggle('paused');
                createRipple(e.clientX, e.clientY);
            });

            heart.addEventListener('touchstart', (e) => {
                isTouching = true;
                const touch = e.touches[0];
                heart.classList.add('paused');
                createRipple(touch.clientX, touch.clientY);
            }, {
                passive: true
            });

            heart.addEventListener('touchend', () => {
                isTouching = false;
                heart.classList.remove('paused');
            });

            container.appendChild(heart);

            const ttl = (duration + delay + 2) * 1000;
            setTimeout(() => {
                if (heart.parentNode) heart.remove();
            }, ttl);
        }

        function createParticle() {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * window.innerWidth + 'px';
            p.style.bottom = Math.random() * 80 + 'px';
            container.appendChild(p);
            setTimeout(() => {
                if (p.parentNode) p.remove();
            }, 12000);
        }

        setInterval(() => {
            createHeart();
        }, 500);

        setInterval(() => {
            createParticle();
        }, 900);

        // click / tap trên nền tạo thêm tim & ripple lớn
        window.addEventListener('click', (e) => {
            // tránh click trúng card trung tâm
            const card = document.querySelector('.card');
            if (card.contains(e.target)) return;
            createHeart(e.clientX);
            createRipple(e.clientX, e.clientY, true);
        });

        window.addEventListener('touchstart', (e) => {
            const card = document.querySelector('.card');
            if (card.contains(e.target)) return;
            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;
            createHeart(x);
            createRipple(x, y, true);
        });
    </script>
</body>

</html>
